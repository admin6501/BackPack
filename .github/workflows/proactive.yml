name: Proactive bug hunt

# The normal CI is the release gate. This run spends more time on hostile
# inputs and repeat recovery, so intermittent failures are found between
# releases rather than waiting for an operator to hit them.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Extended parser fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise untrusted packet and setup-link parsers
        run: |
          set -eux
          go test ./internal/tunnel/l3/     -run=X -fuzz=FuzzParseHeader      -fuzztime=1000000x -parallel=2
          go test ./internal/utils/network/ -run=X -fuzz=FuzzParsePckFrame    -fuzztime=1000000x -parallel=2
          go test ./internal/utils/network/ -run=X -fuzz=FuzzDecodeXdiPayload -fuzztime=1000000x -parallel=2
          go test ./internal/manage/        -run=X -fuzz=FuzzDecodeShareLink  -fuzztime=1000000x -parallel=2
      - name: Keep crashing inputs for reproduction
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 30

  recovery:
    name: Repeated recovery under race detector
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Kill peers during traffic and pause/resume quotas repeatedly
        run: |
          go test ./internal/e2e/ -race \
            -run '^(TestAPeerKilledMidTransferDoesNotWedgeTheOther|TestReverseQuotaPausesAndResumesRealTraffic)$' \
            -count=3 -timeout 30m -v
