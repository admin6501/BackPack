name: Release

# Publishes the assets for a tag. A tag containing a suffix (v1.6.0-beta.1) is
# published as a pre-release, which is what the Beta release channel installs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or republish (for example v1.8.5)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before publishing
        # Nothing gets published that has not passed the suite. A broken
        # release is far more expensive to undo than a slow pipeline.
        run: go test ./... -timeout 20m

      - name: Build release assets
        # No secret is required. When RELEASE_SIGNING_KEY is configured, make
        # embeds its public half and signs SHA256SUMS; otherwise checksums only.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          # signsums reads GITHUB_REF_NAME; dispatch runs otherwise carry the
          # workflow branch here rather than the requested release tag.
          GITHUB_REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: make release

      - name: Verify the tag matches the built version
        run: |
          tag="${RELEASE_TAG}"
          declared="$(tr -d ' \n' < VERSION)"
          # A pre-release tag (v1.6.0-beta.1) carries the version it is a
          # pre-release of, so compare only the part before the suffix.
          base="${tag%%-*}"
          if [ "$base" != "$declared" ]; then
            echo "Tag $tag does not match VERSION ($declared)."
            exit 1
          fi

      - name: Publish assets without replacing release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/backpack_linux_*.tar.gz)
          test "${#archives[@]}" -gt 0
          test -s release/SHA256SUMS
          test -s release/SBOM.txt
          # Normal releases have a hand-written body before the tag workflow
          # starts. Creating a release for a tag pushed directly is a fallback.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--title "Backpack $RELEASE_TAG" --generate-notes)
            case "$RELEASE_TAG" in *-*) args+=(--prerelease) ;; esac
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          assets=("${archives[@]}" release/SHA256SUMS
                  release/SBOM.txt install.sh)
          # A signature exists only when RELEASE_SIGNING_KEY is configured.
          if [ -f release/SHA256SUMS.sig ]; then
            assets+=(release/SHA256SUMS.sig)
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
